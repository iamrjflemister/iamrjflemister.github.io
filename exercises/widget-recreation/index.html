<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather Widget</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="weather">
            <img id="icon" 
            src="images/partly-sunny.svg" 
            alt="Weather Icon"
            width="70"
            >
            <p id="degree">81°</p>
            <p id="time">14:26</p>
            <p id="day-loc">Wed 20 May
                <br> Seattle, WA</p>
        </div>
    </body>
</html>
