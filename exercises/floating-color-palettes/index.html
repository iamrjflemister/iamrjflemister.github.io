<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floating Color Palettes</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div class="color-palette"> 
            <h2> Sky Family</h2>
            <h4 class="color" id="color1">#98D2EB</h4>
            <h4 class="color" id="color2">#E1F2FE</h4>
            <h4 class="color" id="color3">#129CF8</h4>

        </div>
        <div class="fall-palette"> 
            <h2>Browns Family</h2>
            <h4 class="color" id="fall1">#231C07</h4>
            <h4 class="color" id="fall2">#392A16</h4>
            <h4 class="color" id="fall3">#634133</h4>

        </div>
        <div class="grinch-palette"> 
            <h2> Grinch Family</h2>
            <h4 class="color" id="grinch1">#A7C957</h4>
            <h4 class="color" id="grinch2">#6A994E</h4>
            <h4 class="color" id="grinch3">#386641</h4>
        </div>
    </body>
</html>
