<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mebay Product Page</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="layout">
            <div id="thumbnail-column">
<img src="images/dronea3.webp" alt="Main Drone Picture"
height="150">
<img src="images/dronea4.webp" alt="Drone2"
height="150">
<img src="images/dronea2.webp" alt="drone3"
height="150">
<img src="images/dronea1.webp" alt="drone4"
height="150">
<img src="images/dronemain.webp" alt="maindrone"
height="150">
            </div>
            <div id="featured-image-column">
<img src="images/dronemain.webp" alt="maindrone"
height="800">
            </div>
            <div id="product-info-column">
<div>
    <h1>
        DJI Mini 5 Pro Fly More Combo Plus with DJI RC 2, Drone with Camera, 1-Inch CMOS
    </h1>
    <hr>
    <h3>
        US $819.00
    </h3>
    <p>
        Condition: <span id="condition">Excellent</span>
    </p>
    <p> Quantity: <input
  type="text"
  id="name"
  name="name"
  required
  minlength="4"
  maxlength="8"
  size="2" /> 
<span id="only-3">-Only 3 Left!</span>
</p>

<div id="Buttons">
    <a href="Buy" id="Buy">Buy It Now</a>
    <br>
    <a href="add">Add to Cart</a>
    <br>
    <a href="wishlist">Add to Wishlist</a>
</div>
    
</div>
            </div>

        </div>
    </body>
</html>
